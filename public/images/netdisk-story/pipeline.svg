<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="420" fill="#0f1c33"/>
  <text x="600" y="52" text-anchor="middle" fill="#e8eef7" font-size="24" font-weight="700">一条流水线：从微博动态到自己账号的发布清单</text>
  <text x="600" y="80" text-anchor="middle" fill="#7d93b8" font-size="14">微博网盘资源监控台的七个环节，全程本地运行</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="120" width="180" height="90" rx="12" fill="#1b2d4f" stroke="#31496f"/>
    <text x="130" y="158" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">① 微博监控</text>
    <text x="130" y="186" text-anchor="middle" fill="#7d93b8" font-size="12">跟指定账号的公开动态</text>

    <line x1="220" y1="165" x2="262" y2="165" stroke="#3d5a8a" stroke-width="2"/>
    <polygon points="262,159 274,165 262,171" fill="#3d5a8a"/>

    <rect x="274" y="120" width="180" height="90" rx="12" fill="#1b2d4f" stroke="#31496f"/>
    <text x="364" y="158" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">② 短链展开</text>
    <text x="364" y="186" text-anchor="middle" fill="#7d93b8" font-size="12">t.cn → 真实网盘地址</text>

    <line x1="454" y1="165" x2="496" y2="165" stroke="#3d5a8a" stroke-width="2"/>
    <polygon points="496,159 508,165 496,171" fill="#3d5a8a"/>

    <rect x="508" y="120" width="180" height="90" rx="12" fill="#1b2d4f" stroke="#31496f"/>
    <text x="598" y="158" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">③ 链接识别</text>
    <text x="598" y="186" text-anchor="middle" fill="#7d93b8" font-size="12">夸克 / 百度链接解析</text>

    <line x1="688" y1="165" x2="730" y2="165" stroke="#3d5a8a" stroke-width="2"/>
    <polygon points="730,159 742,165 730,171" fill="#3d5a8a"/>

    <rect x="742" y="120" width="180" height="90" rx="12" fill="#1b2d4f" stroke="#31496f"/>
    <text x="832" y="158" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">④ 转存归档</text>
    <text x="832" y="186" text-anchor="middle" fill="#7d93b8" font-size="12">转进自己网盘·防重复</text>

    <line x1="922" y1="165" x2="964" y2="165" stroke="#3d5a8a" stroke-width="2"/>
    <polygon points="964,159 976,165 964,171" fill="#3d5a8a"/>

    <rect x="976" y="120" width="180" height="90" rx="12" fill="#1b2d4f" stroke="#31496f"/>
    <text x="1066" y="158" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">⑤ 重建分享</text>
    <text x="1066" y="186" text-anchor="middle" fill="#7d93b8" font-size="12">生成自己的分享链接</text>
  </g>

  <!-- connector down -->
  <path d="M 1066 210 L 1066 250 L 598 250 L 598 262" fill="none" stroke="#3d5a8a" stroke-width="2"/>
  <polygon points="592,262 598,274 604,262" fill="#3d5a8a"/>

  <!-- row 2 -->
  <g>
    <rect x="330" y="274" width="270" height="90" rx="12" fill="#173d5c" stroke="#2b6a94"/>
    <text x="465" y="312" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">⑥ 文案整理</text>
    <text x="465" y="340" text-anchor="middle" fill="#8fb8d4" font-size="12">自动排版成清单·加话题标签</text>

    <line x1="600" y1="319" x2="642" y2="319" stroke="#3d5a8a" stroke-width="2"/>
    <polygon points="642,313 654,319 642,325" fill="#3d5a8a"/>

    <rect x="654" y="274" width="270" height="90" rx="12" fill="#173d5c" stroke="#2b6a94"/>
    <text x="789" y="312" text-anchor="middle" fill="#e8eef7" font-size="16" font-weight="600">⑦ 发布管理</text>
    <text x="789" y="340" text-anchor="middle" fill="#8fb8d4" font-size="12">由你自己确认后发布</text>
  </g>

  <!-- badge -->
  <rect x="40" y="290" width="200" height="58" rx="10" fill="#12253f" stroke="#31496f"/>
  <circle cx="66" cy="319" r="6" fill="#4ade80"/>
  <text x="84" y="315" fill="#a8bcd8" font-size="12">数据落盘 db.json</text>
  <text x="84" y="333" fill="#a8bcd8" font-size="12">重启不丢·断点续跑</text>

  <text x="600" y="400" text-anchor="middle" fill="#5c7396" font-size="12">账号池轮换 · Cookie 登录态管理 · 内容过滤规则可配置</text>
</svg>
