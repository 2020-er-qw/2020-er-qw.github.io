# ============================================================
# Sveltia CMS 配置 — AI Field Notes 文章后台（中英双语模式）
#
# 语言机制：一个条目 = 一篇文章的中英两个版本
#   - 编辑页顶部有 中文 / English 标签页切换
#   - 标题/摘要/正文 按语言各自填写
#   - 封面/标签/日期/置顶/草稿 两种语言共享，只填一次
#   - 点一次发布，中英两个文件一起提交上线
#   - 英文存 <名称>.md，中文存 <名称>.zh.md
#
# 登录方式：后台点 "Sign In Using Access Token"，粘贴一个
#   fine-grained PAT（只给本仓库 Contents 读写权限），无需服务器
# ============================================================
backend:
  name: github
  repo: 2020-er-qw/2020-er-qw.github.io   # 用户站点仓库：免费地址 https://2020-er-qw.github.io
  branch: main
  # 注意：不配置 auth_endpoint / base_url，Sveltia 会显示"令牌登录"按钮
  # 提交信息模板，方便在 Git 历史里看到是谁发的
  commit_messages:
    create: 'CMS: create post {{path}}'
    update: 'CMS: update post {{path}}'
    delete: 'CMS: delete post {{path}}'
    uploadMedia: 'CMS: upload {{path}}'
    deleteMedia: 'CMS: delete {{path}}'

# 多语言：一个条目管中英两版，文件按语言分开存
i18n:
  structure: multiple_files
  locales: [en, zh]
  default_locale: en
  omit_default_locale_from_file_path: true   # 英文（默认语言）不带后缀：文章.md；中文带后缀：文章.zh.md

# 后台界面语言
ui:
  labels:
    publish: '发布 / Publish'

media_folder: 'public/covers'
public_folder: '/covers'
media_library:
  config:
    multiple: false

collections:
  - name: 'blog'
    label: '文章 Posts'
    folder: 'src/content/blog'
    create: true
    delete: true
    slug: '{{fields.title}}'
    i18n: true   # 启用多语言（用顶部全局配置）
    # 列表页顶部筛选：按发布/草稿状态过滤
    view_filters:
      - label: '已发布 Published'
        field: draft
        values: [false]
      - label: '草稿 Draft'
        field: draft
        values: [true]
    # 新建文章默认带这些字段值
    defaults:
      - key: 'draft'
        value: true
      - key: 'pinned'
        value: false
    fields:
      # —— 按语言各自填写（中英标签页切换）——
      - { label: '标题 Title', name: 'title', widget: 'string', required: true, i18n: true }
      - { label: '摘要 Description', name: 'description', widget: 'text', required: true, i18n: true }
      # —— 两种语言共享，只填一次 ——
      - { label: '发布日期 Pub date', name: 'pubDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: 'HH:mm', format: 'YYYY-MM-DD HH:mm', default: '{{now}}', required: true, i18n: duplicate,
          hint: '默认当前时间。同一天发多篇文章时，靠这个时间决定谁排在前面' }
      - { label: '更新时间 Updated date（可选）', name: 'updatedDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: 'HH:mm', format: 'YYYY-MM-DD HH:mm', required: false, i18n: duplicate }
      - { label: '封面图 Cover', name: 'cover', widget: 'image', required: false, i18n: duplicate,
          hint: '建议 16:9 横图，上传后自动存到 public/covers；中英两版共用这张图' }
      - { label: '置顶 Pinned', name: 'pinned', widget: 'boolean', default: false, i18n: duplicate,
          hint: '打开后这篇文章会固定在首页顶部。同一语言只置顶一篇' }
      - { label: '草稿 Draft', name: 'draft', widget: 'boolean', default: true, i18n: duplicate,
          hint: '发布前务必关掉，否则网站上看不到。中英版本共用这一个开关' }
      - { label: '标签 Tags', name: 'tags', widget: 'list', required: false, i18n: duplicate,
          field: { label: '标签', name: 'tag', widget: 'string' } }
      - { label: '正文 Body', name: 'body', widget: 'markdown', required: true, i18n: true }
