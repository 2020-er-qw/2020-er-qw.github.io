# ============================================================
# Sveltia CMS 配置 — AI Field Notes 文章后台
# 上线前必改：把下面 backend.repo 换成你自己的 GitHub 仓库
# 登录方式：后台点 "Sign In Using Access Token"，粘贴一个
#   fine-grained PAT（只给本仓库 Contents 读写权限），无需服务器
# ============================================================
backend:
  name: github
  repo: 2020-er-qw/2020-er-qw.github.io   # 用户站点仓库：免费地址 https://2020-er-qw.github.io
  branch: main
  # 注意：不配置 auth_endpoint / base_url，Sveltia 会显示"令牌登录"按钮
  # 提交信息模板，方便在 Git 历史里看到是谁发的
  commit_messages:
    create: 'CMS: create post {{path}}'
    update: 'CMS: update post {{path}}'
    delete: 'CMS: delete post {{path}}'
    uploadMedia: 'CMS: upload {{path}}'
    deleteMedia: 'CMS: delete {{path}}'

# 后台界面语言
ui:
  labels:
    publish: '发布 / Publish'

media_folder: 'public/covers'
public_folder: '/covers'
media_library:
  config:
    multiple: false

collections:
  - name: 'blog'
    label: '文章 Posts'
    folder: 'src/content/blog'
    create: true
    delete: true
    slug: '{{fields.title}}'
    # 新建文章默认带这些字段值
    defaults:
      - key: 'lang'
        value: 'en'
      - key: 'draft'
        value: true
      - key: 'pinned'
        value: false
      - key: 'pubDate'
        value: '2026-11-26'
    fields:
      - { label: '标题 Title', name: 'title', widget: 'string', required: true }
      - { label: '摘要 Description', name: 'description', widget: 'text', required: true }
      - { label: '发布日期 Pub date', name: 'pubDate', widget: 'date', format: 'YYYY-MM-DD', required: true }
      - { label: '更新时间 Updated date（可选）', name: 'updatedDate', widget: 'date', format: 'YYYY-MM-DD', required: false }
      - { label: '封面图 Cover', name: 'cover', widget: 'image', required: false,
          hint: '建议 16:9 横图，上传后自动存到 public/covers' }
      - { label: '语言 Language', name: 'lang', widget: 'select', options: ['en', 'zh'], default: 'en',
          hint: 'en=英文版，zh=中文版。做双语时请分别建两篇' }
      - { label: '翻译稿 Translation', name: 'translation', widget: 'string', required: false,
          hint: '另一语言版本的 slug（不含 .md），例如 welcome-to-ai-field-notes-zh；没有就留空' }
      - { label: '置顶 Pinned', name: 'pinned', widget: 'boolean', default: false,
          hint: '打开后这篇文章会固定在首页顶部。同一语言只置顶一篇' }
      - { label: '草稿 Draft', name: 'draft', widget: 'boolean', default: true,
          hint: '发布前务必关掉，否则网站上看不到' }
      - { label: '标签 Tags', name: 'tags', widget: 'list', required: false,
          field: { label: '标签', name: 'tag', widget: 'string' } }
      - { label: '正文 Body', name: 'body', widget: 'markdown', required: true }
